plugins {
    id 'com.android.application'
}

android {
    namespace 'app.mfstudio.webview'
    compileSdk 34

    defaultConfig {
        applicationId "app.mfstudio.webview"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
